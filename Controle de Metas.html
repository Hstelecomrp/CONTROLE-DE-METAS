<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Metas</title>
<style>
:root{--bg:#f1f3fb;--card:#ffffff;--tx:#0f172a;--mut:#64748b;--bd:#e5e8f3;--sh:0 8px 28px rgba(30,41,90,.08);--pos:#f43f5e;--ctl:#3b82f6;--res:#10b981;--chip:#f3f5fc;--hero:linear-gradient(120deg,#0f172a 0%,#1e1b4b 55%,#4c1d95 100%);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#141a30;--tx:#eef1fb;--mut:#94a0c4;--bd:#232b4a;--sh:0 8px 28px rgba(0,0,0,.35);--pos:#fb7185;--ctl:#60a5fa;--res:#34d399;--chip:#1b2340}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#141a30;--tx:#eef1fb;--mut:#94a0c4;--bd:#232b4a;--sh:0 8px 28px rgba(0,0,0,.35);--pos:#fb7185;--ctl:#60a5fa;--res:#34d399;--chip:#1b2340}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px;-webkit-font-smoothing:antialiased}
#painel{max-width:1200px;margin:0 auto;background:var(--bg)}
.hero{background:var(--hero);color:#fff;border-radius:22px;padding:22px 26px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.hero:after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.55),transparent 70%)}
.hero h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.5px;position:relative}
.hero p{margin:4px 0 0;opacity:.8;position:relative}
.hero .mes{position:relative;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:8px 12px;backdrop-filter:blur(6px)}
.hero .mes input{background:transparent;border:0;color:#fff;font:inherit;font-weight:600;color-scheme:dark;padding:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.card h2{margin:0 0 12px;font-size:17px;font-weight:700}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
button,input,select{font:inherit;color:var(--tx);background:var(--chip);border:1px solid var(--bd);border-radius:12px;padding:8px 13px;transition:.18s}
button{cursor:pointer;font-weight:600}
button:hover{transform:translateY(-1px);border-color:var(--ctl)}
button:active{transform:scale(.97)}
input:focus,select:focus{outline:2px solid var(--ctl);outline-offset:1px}
.pri{background:linear-gradient(120deg,#6366f1,#8b5cf6);color:#fff;border:0;box-shadow:0 6px 16px rgba(99,102,241,.35)}
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:16px}
.g{border-radius:20px;padding:18px 20px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh)}
.g.pos{background:linear-gradient(135deg,#f43f5e,#fb7185 60%,#fda4af)}
.g.ctl{background:linear-gradient(135deg,#2563eb,#3b82f6 60%,#38bdf8)}
.g.res{background:linear-gradient(135deg,#059669,#10b981 60%,#5eead4)}
.g.mil{background:linear-gradient(135deg,#d97706,#f59e0b 60%,#fcd34d)}
.g:after{content:"";position:absolute;right:-30px;bottom:-40px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.16)}
.g .t{font-size:12px;font-weight:700;letter-spacing:1px;opacity:.9}
.g .n{font-size:42px;font-weight:800;line-height:1.1;letter-spacing:-1px}
.g .n small{font-size:20px;opacity:.8;font-weight:600}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.28);margin:8px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.g .s{display:flex;justify-content:space-between;align-items:center;font-size:13px;position:relative;z-index:1}
.g input{width:68px;padding:4px 8px;background:rgba(255,255,255,.95);color:#0f172a;border:0;border-radius:9px;font-weight:700}
.add{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.add input{flex:1;min-width:160px}
.rows{display:flex;flex-direction:column;gap:10px}
.vrow{display:grid;grid-template-columns:180px repeat(4,1fr) 108px;gap:12px;align-items:center;background:var(--chip);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;transition:.2s;animation:in .35s both}
.vrow:hover{box-shadow:var(--sh);transform:translateY(-1px)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.who{display:flex;align-items:center;gap:10px;font-weight:700;min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;background:linear-gradient(135deg,#6366f1,#ec4899)}
.m{min-width:0}
.mh{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.mh b{font-size:12px;letter-spacing:.5px}
.mh .c{margin-left:auto;font-size:13px;font-weight:700}
.pos{--c:var(--pos)}.ctl{--c:var(--ctl)}.res{--c:var(--res)}.mil{--c:var(--mil)}
:root{--mil:#f59e0b}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--mil:#fbbf24}}:root[data-theme="dark"]{--mil:#fbbf24}
.m b,.m .c{color:var(--c)}
.rb{width:26px;height:26px;padding:0;border-radius:9px;line-height:1;font-size:16px;background:var(--card)}
.rb.p{background:var(--c);color:#fff;border:0}
.sqs{display:flex;flex-wrap:wrap;gap:3px}
.sq{width:12px;height:12px;border:1.6px solid var(--c);border-radius:4px;transition:.2s}
.sq.f{background:var(--c);box-shadow:0 0 8px color-mix(in srgb,var(--c) 55%,transparent)}
.mv{font-size:13px;color:var(--mut)}.mv b{font-size:24px;line-height:1.2}.ma{display:flex;gap:4px;margin-top:6px}.ma input{width:84px;padding:4px 8px}
.act{display:flex;flex-direction:column;gap:6px}.act button{font-size:13px;padding:6px 10px}
.ed{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding-top:10px;border-top:1px dashed var(--bd)}.ed label{font-size:12px;font-weight:700;color:var(--c);display:flex;flex-direction:column;gap:3px}.ed input{width:100px}
.del.ask{background:#ef4444;color:#fff;border:0}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.ch{background:var(--chip);border-radius:16px;padding:12px;border:1px solid var(--bd)}
.ch .sub{font-weight:700;margin-bottom:4px}
svg{width:100%;height:auto;display:block}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px}
.lg i{display:inline-block;width:14px;height:4px;border-radius:4px;margin-right:6px;vertical-align:middle}
.st{font-size:12px;color:var(--mut);margin-left:auto}
.vazio{color:var(--mut);text-align:center;padding:18px}
@media(max-width:860px){.vrow{grid-template-columns:1fr 1fr}.who{grid-column:1/-1}.act{grid-column:1/-1;flex-direction:row}.act button{flex:1}}
</style>
</head>
<body>
<div class="tools">
  <button class="pri" id="img">📷 Salvar como imagem</button>
  <button id="csv">📊 Planilha (CSV)</button>
  <button id="bak">💾 Backup</button>
  <button id="imp">📂 Restaurar</button>
  <input type="file" id="file" accept=".json" hidden>
  <label>Data da venda <input type="date" id="dia"></label>
  <span class="st" id="status"></span>
</div>

<div id="painel">
  <div class="hero">
    <div><h1>🎯 Controle de Metas</h1><p>Foco, disciplina e ação geram resultados!</p></div>
    <div class="mes">📅 <input type="month" id="mes"></div>
  </div>
  <div class="goals" id="goals"></div>
  <div class="card">
    <h2>Vendedores</h2>
    <div class="add" data-ignore="1"><input id="novo" placeholder="Nome do novo vendedor" maxlength="40"><button class="pri" id="add">+ Adicionar</button></div>
    <div class="rows" id="rows"></div>
  </div>
  <div class="card">
    <h2>📈 Evolução no mês <select id="selv" style="margin-left:8px"></select></h2>
    <div class="charts">
      <div class="ch"><div class="sub">Loja (total)</div><div id="chL"></div></div>
      <div class="ch"><div class="sub" id="indT">Individual</div><div id="chI"></div></div>
    </div>
    <div class="lg"><span><i style="background:var(--pos)"></i>Pós</span><span><i style="background:var(--ctl)"></i>Controle</span><span><i style="background:var(--res)"></i>Residencial</span><span><i style="background:var(--mil)"></i>Milhas</span><span>Tracejado = meta</span></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const TIPOS=[["pos","Pós"],["ctl","Controle"],["res","Residencial"],["mil","Milhas"]];
const KEY="controle-metas-v1";
let S={metas:{pos:30,ctl:50,res:24,mil:10},vend:[],vendas:[],t:0};let editId=null;
let dbDoc=null,timer=null,askDel=null,askT=null;
const $=id=>document.getElementById(id);
const hoje=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>(Math.round(n*10)/10).toString().replace(".",",");
const setStatus=t=>$("status").textContent=t;
function seed(){["Lucas Adao","Whalter","Maria","Giovana","Natalia","Daniela","Larissa","Jefferson","Sergio","Lucas Moura"].forEach(n=>S.vend.push({id:uid(),nome:n}))}

function save(){
  S.t=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  setStatus("salvando…");clearTimeout(timer);
  timer=setTimeout(async()=>{
    if(dbDoc){try{await dbDoc.set({json:JSON.stringify(S),t:S.t});setStatus("✓ salvo");return}catch(e){}}
    setStatus("✓ salvo neste navegador");
  },500);
}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.vend){S=o;return true}}}catch(e){}return false}
async function initDb(){
  try{
    if(!window.claude)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    dbDoc=db.collection("data/users/"+await user.id()).doc("estado");
    const snap=await dbDoc.get();
    if(snap.exists){const d=snap.data(),o=JSON.parse(d.json);
      if(o&&o.vend&&(d.t||0)>(S.t||0)){S=o;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render();setStatus("✓ dados carregados")}
      else save();
    }else save();
  }catch(e){}
}

const mes=()=>$("mes").value;
const doMes=()=>S.vendas.filter(v=>v.d.startsWith(mes()));
const metaInd=(k,v)=>(v&&v.metas&&v.metas[k]!=null)?v.metas[k]:S.metas[k]/Math.max(S.vend.length,1);

function render(){
  S.metas=Object.assign({mil:10},S.metas);
  const vm=doMes();
  $("goals").innerHTML=TIPOS.map(([k,n])=>{
    const tot=vm.filter(v=>v.k===k).reduce((a,x)=>a+(x.q||1),0),pc=S.metas[k]?Math.min(100,tot/S.metas[k]*100):0;
    return `<div class="g ${k}"><div class="t">META ${n.toUpperCase()} · LOJA</div><div class="n">${tot} <small>/ ${S.metas[k]}</small></div><div class="bar"><i style="width:${pc}%"></i></div><div class="s"><span>${Math.round(pc)}% · ${fmt(metaInd(k))} por vendedor</span><input type="number" min="0" value="${S.metas[k]}" data-m="${k}" aria-label="Meta ${n}" data-ignore="1"></div></div>`}).join("");
  $("rows").innerHTML=S.vend.length?S.vend.map((v,i)=>{
    const cols=TIPOS.map(([k,n])=>{
      const c=vm.filter(x=>x.v===v.id&&x.k===k).reduce((a,x)=>a+(x.q||1),0),tot=Math.max(Math.ceil(metaInd(k,v)),c);
      let sq="";for(let j=0;j<tot;j++)sq+=`<span class="sq ${j<c?"f":""}"></span>`;
      return `<div class="m ${k}"><div class="mh"><b>${n.toUpperCase()}</b><span class="c">${c}/${fmt(metaInd(k,v))}</span><button class="rb" data-r="${v.id}|${k}" title="Desfazer" data-ignore="1">−</button>${k==="mil"?"":`<button class="rb p" data-a="${v.id}|${k}" title="Adicionar venda" data-ignore="1">+</button>`}</div>${k==="mil"?`<div class="mv"><b>${fmt(c)}</b> de ${fmt(metaInd(k,v))} milhas</div><div class="ma" data-ignore="1"><input type="number" min="0" step="any" id="q-${v.id}" placeholder="Milhas" aria-label="Milhas a adicionar"><button class="rb p" data-am="${v.id}" title="Adicionar milhas">+</button></div>`:`<div class="sqs">${sq}</div>`}</div>`}).join("");
    const a=askDel===v.id;
    return `<div class="vrow" style="animation-delay:${i*30}ms"><div class="who"><div class="av">${esc(v.nome[0].toUpperCase())}</div><span>${esc(v.nome)}</span></div>${cols}<div class="act" data-ignore="1"><button data-e="${v.id}">🎯 Metas${v.metas&&Object.keys(v.metas).length?" ✎":""}</button><button class="del ${a?"ask":""}" data-d="${v.id}">${a?"Confirmar?":"🗑 Excluir"}</button></div>${editId===v.id?`<div class="ed" data-ignore="1">${TIPOS.map(([k,n])=>`<label class="${k}">${n}<input type="number" min="0" step="0.5" data-vm="${v.id}|${k}" value="${v.metas&&v.metas[k]!=null?v.metas[k]:""}" placeholder="${fmt(S.metas[k]/Math.max(S.vend.length,1))}"></label>`).join("")}<button data-vreset="${v.id}">Usar padrão</button><span class="st">Vazio = meta da loja ÷ vendedores</span></div>`:""}</div>`}).join(""):`<div class="vazio">Nenhum vendedor ainda. Adicione acima.</div>`;
  const sel=$("selv"),cur=sel.value;
  sel.innerHTML=S.vend.map(v=>`<option value="${v.id}">${esc(v.nome)}</option>`).join("");
  if(S.vend.some(v=>v.id===cur))sel.value=cur;
  charts();
}

const CV={pos:"var(--pos)",ctl:"var(--ctl)",res:"var(--res)",mil:"var(--mil)"};
function chart(list,metas,uidc){
  const [y,m]=mes().split("-").map(Number),dias=new Date(y,m,0).getDate();
  const W=700,H=270,L=36,R=14,T=14,B=26;
  const series=TIPOS.map(([k])=>{const c=Array(dias+1).fill(0);list.filter(v=>v.k===k).forEach(v=>c[+v.d.slice(8,10)]+=(v.q||1));let a=0;return{k,vals:c.slice(1).map(x=>a+=x)}});
  const max=Math.max(1,...series.map(s=>s.vals[dias-1]),...TIPOS.map(([k])=>metas[k]));
  const X=i=>L+(W-L-R)*i/Math.max(dias-1,1),Y=v=>T+(H-T-B)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de vendas acumuladas"><defs>${TIPOS.map(([k])=>`<linearGradient id="g${uidc}${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${CV[k]}" stop-opacity=".28"/><stop offset="1" stop-color="${CV[k]}" stop-opacity="0"/></linearGradient>`).join("")}</defs>`;
  for(let i=0;i<=4;i++){const v=max*i/4;s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bd)"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--mut)">${Math.round(v)}</text>`}
  for(let d=1;d<=dias;d+=dias>20?3:2)s+=`<text x="${X(d-1)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--mut)">${d}</text>`;
  series.forEach(({k,vals})=>{
    const pts=vals.map((v,i)=>X(i)+","+Y(v)).join(" ");
    s+=`<line x1="${L}" x2="${W-R}" y1="${Y(metas[k])}" y2="${Y(metas[k])}" stroke="${CV[k]}" stroke-dasharray="6 6" opacity=".55"/>`;
    s+=`<polygon points="${X(0)},${Y(0)} ${pts} ${X(dias-1)},${Y(0)}" fill="url(#g${uidc}${k})"/>`;
    s+=`<polyline fill="none" stroke="${CV[k]}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/>`;
    s+=`<circle cx="${X(dias-1)}" cy="${Y(vals[dias-1])}" r="5" fill="${CV[k]}" stroke="var(--card)" stroke-width="2"/>`;
  });
  return s+"</svg>";
}
function charts(){
  const vm=doMes();
  $("chL").innerHTML=chart(vm,S.metas,"L");
  const id=$("selv").value,v=S.vend.find(x=>x.id===id);
  $("indT").textContent="Individual: "+(v?v.nome:"—");
  $("chI").innerHTML=v?chart(vm.filter(x=>x.v===id),Object.fromEntries(TIPOS.map(([k])=>[k,metaInd(k,v)])),"I"):"<div class='vazio'>Adicione um vendedor.</div>";
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.a){const[v,k]=t.dataset.a.split("|");S.vendas.push({v,k,d:$("dia").value||hoje()});save();render()}
  else if(t.dataset.r){const[v,k]=t.dataset.r.split("|");
    for(let i=S.vendas.length-1;i>=0;i--){const x=S.vendas[i];if(x.v===v&&x.k===k&&x.d.startsWith(mes())){S.vendas.splice(i,1);break}}
    save();render()}
  else if(t.dataset.am){const q=+$("q-"+t.dataset.am).value;if(q>0){S.vendas.push({v:t.dataset.am,k:"mil",d:$("dia").value||hoje(),q});save();render()}}
  else if(t.dataset.e){editId=editId===t.dataset.e?null:t.dataset.e;render()}
  else if(t.dataset.vreset){const v=S.vend.find(x=>x.id===t.dataset.vreset);if(v){delete v.metas;save();render()}}
  else if(t.dataset.d){
    const id=t.dataset.d;clearTimeout(askT);
    if(askDel===id){S.vend=S.vend.filter(x=>x.id!==id);S.vendas=S.vendas.filter(x=>x.v!==id);askDel=null;save();render()}
    else{askDel=id;render();askT=setTimeout(()=>{askDel=null;render()},3500)}
  }
});
document.addEventListener("change",e=>{if(e.target.dataset.m){S.metas[e.target.dataset.m]=Math.max(0,+e.target.value||0);save();render()}
  else if(e.target.dataset.vm){const[id,k]=e.target.dataset.vm.split("|"),v=S.vend.find(x=>x.id===id);if(v){v.metas=v.metas||{};if(e.target.value==="")delete v.metas[k];else v.metas[k]=Math.max(0,+e.target.value);save();render()}}});
function addV(){const n=$("novo").value.trim();if(!n)return;S.vend.push({id:uid(),nome:n});$("novo").value="";save();render()}
$("add").onclick=addV;$("novo").onkeydown=e=>{if(e.key==="Enter")addV()};
$("mes").onchange=render;$("selv").onchange=charts;

async function baixar(filename,data){
  try{const d=window.claude&&await claude.use("downloads");if(d){await d.save({filename,data});return}}catch(e){}
  const a=document.createElement("a");a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=filename;a.click();
}
$("img").onclick=async()=>{
  if(!window.html2canvas){setStatus("biblioteca de imagem indisponível");return}
  setStatus("gerando imagem…");
  try{
    const cv=await html2canvas($("painel"),{scale:2,backgroundColor:getComputedStyle(document.body).backgroundColor,useCORS:true,ignoreElements:el=>!!(el.dataset&&el.dataset.ignore==="1")});
    cv.toBlob(async b=>{await baixar("metas-"+mes()+".png",b);setStatus("✓ imagem pronta")},"image/png");
  }catch(e){setStatus("não foi possível gerar a imagem")}
};
$("csv").onclick=()=>{
  const nome=id=>(S.vend.find(v=>v.id===id)||{nome:"(excluído)"}).nome,tn={pos:"Pós",ctl:"Controle",res:"Residencial",mil:"Milhas"};
  const rows=["Data;Vendedor;Tipo;Quantidade"].concat([...S.vendas].sort((a,b)=>a.d.localeCompare(b.d)).map(v=>[v.d,'"'+nome(v.v).replace(/"/g,'""')+'"',tn[v.k],String(v.q||1).replace(".",",")].join(";")));
  baixar("vendas-"+mes()+".csv","\ufeff"+rows.join("\n"));
};
$("bak").onclick=()=>baixar("backup-metas-"+hoje()+".json",JSON.stringify(S));
$("imp").onclick=()=>$("file").click();
$("file").onchange=async e=>{
  try{const o=JSON.parse(await e.target.files[0].text());
    if(o&&Array.isArray(o.vend)&&Array.isArray(o.vendas)){S=o;save();render();setStatus("✓ backup restaurado")}else setStatus("arquivo inválido")}
  catch(x){setStatus("não foi possível ler o arquivo")}
  e.target.value="";
};
